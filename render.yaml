services:
  # Backend API Service
  - type: web
    name: provn-orbital25-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/opt/render/project/src/backend/data/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NEWS_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://provn-orbital25-frontend.onrender.com
    disk:
      name: sqlite-disk
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: provn-orbital25-frontend
    env: static
    rootDir: frontend
    buildCommand: chmod +x build-with-env-check.sh && ./build-with-env-check.sh
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://provn-orbital25-backend.onrender.com/api
