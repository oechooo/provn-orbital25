<!DOCTYPE html>
<html>
<head>
    <title>Test Article API</title>
</head>
<body>
    <h1>Test Article API</h1>
    <div id="results"></div>
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                console.log('Testing API...');
                const response = await fetch('http://localhost:3000/api/articles/185');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Data received:', data);
                
                results.innerHTML = `
                    <h2>Success!</h2>
                    <p>Article Title: ${data.article?.title || 'No title'}</p>
                    <p>Has Market: ${data.article?.market ? 'Yes' : 'No'}</p>
                    <p>Market ID: ${data.article?.market?.id || 'N/A'}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                results.innerHTML = `
                    <h2>Error!</h2>
                    <p>${error.message}</p>
                `;
            }
        }
        
        // Test immediately when page loads
        testAPI();
    </script>
</body>
</html>
